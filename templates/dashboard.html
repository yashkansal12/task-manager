<h2>Dashboard</h2>

<button onclick="loadData()">Load Data</button>
<pre id="data"></pre>

<script>
function loadData() {
  fetch("/api/dashboard/", {
    headers: {
      "Authorization": "Bearer " + localStorage.getItem("token")
    }
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("data").innerText =
      JSON.stringify(data, null, 2);
  });
}
</script>
